name: Vetra pilot checks
on:
  push:
    paths: ['vetra/**', 'tests/test_vetra*.py', 'requirements-vetra.txt', '.github/workflows/vetra.yml']
  pull_request:
    paths: ['vetra/**', 'tests/test_vetra*.py', 'requirements-vetra.txt', '.github/workflows/vetra.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-vetra.txt pytest
      - run: python -m pytest --noconftest tests/test_vetra*.py -q
      - run: python -m compileall -q vetra
