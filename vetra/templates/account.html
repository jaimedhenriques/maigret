<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Vetra</title><link rel="stylesheet" href="/static/operations.css"></head><body><main><a href="/">vetra.</a><h1>{{ title }}</h1>{% if message %}<p role="status">{{ message }}</p>{% endif %}{% if kind != 'done' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% if kind == 'request' %}<label for="email">Work email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username">{% else %}<label for="password">New password</label><input id="password" name="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password">{% endif %}<button type="submit">{{ 'Send reset link' if kind == 'request' else 'Update password' }}</button></form>{% endif %}<p><a href="/login">Back to sign in</a></p></main></body></html>
